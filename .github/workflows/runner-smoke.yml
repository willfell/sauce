name: runner-smoke

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: sauce
    steps:
      - uses: actions/checkout@v4
      - name: Runner facts
        run: |
          echo "arch: $(uname -m)"
          echo "host: $(hostname)"
          echo "gh before install: $(command -v gh || echo MISSING)"
      - name: Install gh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the arm64 dependency tree resolves
        run: |
          npm install --omit=dev
          node -e 'require("@xenova/transformers"); console.log("transformers ok")'
          gh --version

  macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Runner facts
        run: |
          echo "arch: $(uname -m)"
          echo "host: $(hostname)"
          sw_vers
      - name: Homebrew is present and usable
        run: |
          brew --version
          brew --prefix
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Candidate CLI runs from the checkout
        run: |
          node -v
          node platform/cli/sauce-cli.js help | head -3
