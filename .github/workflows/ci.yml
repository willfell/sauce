name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sauce repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev deps
        run: npm install --omit=dev

      - name: Run full release:preflight (includes integration smoke)
        run: npm run release:preflight

      - name: Validate checked-out candidate CLI and fresh-vault bootstrap (macOS only)
        if: matrix.os == 'macos-latest'
        env:
          SAUCE_CANDIDATE_CLI: ${{ github.workspace }}/platform/cli/sauce-cli.js
        run: |
          test -f "$SAUCE_CANDIDATE_CLI"
          node "$SAUCE_CANDIDATE_CLI" help | head -3
          TMP_VAULT="$RUNNER_TEMP/sauce-ci-vault"
          mkdir -p "$TMP_VAULT"
          node "$SAUCE_CANDIDATE_CLI" bootstrap --vault "$TMP_VAULT" --non-interactive --no-register
          ls -la "$TMP_VAULT"
          node "$SAUCE_CANDIDATE_CLI" audit --vault "$TMP_VAULT"
          echo "audit ok"

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/sauce-ci-vault" 2>/dev/null || true

  released-formula-smoke:
    name: released formula smoke (non-required)
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Tap and install released sauce formula
        run: |
          brew tap willfell/sauce
          brew install willfell/sauce/sauce
          which sauce
          sauce help | head -3

      - name: Bootstrap a fresh vault via released formula
        run: |
          TMP_VAULT="$RUNNER_TEMP/sauce-released-formula-vault"
          mkdir -p "$TMP_VAULT"
          sauce bootstrap --vault "$TMP_VAULT" --non-interactive --no-register
          ls -la "$TMP_VAULT"

      - name: Cleanup released formula smoke
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/sauce-released-formula-vault" 2>/dev/null || true
          brew uninstall sauce 2>/dev/null || true
          brew untap willfell/sauce 2>/dev/null || true
