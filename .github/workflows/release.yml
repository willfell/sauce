name: release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---- maintain the standing release PR on every main push (skip the bot's own commits) ----
  prepare-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, 'chore(seed):')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --omit=dev
      - name: Compute + apply per-component + umbrella bumps
        run: node scripts/release/compute-release.js --write
      - name: Detect whether anything is releasable
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No releasable changes since the last tag — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the bumped state (preflight gate — replaces the PR's missing auto-CI)
        if: steps.diff.outputs.changed == 'true'
        run: npm run release:preflight
      - name: Read computed version
        if: steps.diff.outputs.changed == 'true'
        id: ver
        run: echo "version=$(node -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Open/update the standing release PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          branch: release/next
          delete-branch: false
          commit-message: "chore(release): v${{ steps.ver.outputs.version }}"
          title: "chore(release): v${{ steps.ver.outputs.version }}"
          body: |
            Automated release PR — merging this tags **v${{ steps.ver.outputs.version }}** and ships to brew.

            `compute-release.js` computed these per-component + umbrella bumps from the conventional
            commits since the last `v*` tag, and **preflight already passed on this exact bumped state**
            (run inside prepare-release). Merge to release.

  # ---- on release-PR merge: preflight -> tag -> patch + auto-merge the tap (GITHUB_TOKEN + TAP_PR_TOKEN; no PAT) ----
  tag-and-ship:
    if: ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --omit=dev
      - name: Preflight (final gate before shipping)
        run: npm run release:preflight
      - name: Create + push annotated tag
        id: tag
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists — skipping tag push"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
      - name: Compute tarball sha256 + URL
        id: sha
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          URL="https://github.com/willfell/sauce/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=""
          for i in 1 2 3 4 5; do
            if SHA=$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}'); then
              if [ -n "$SHA" ] && [ "$SHA" != "" ]; then break; fi
            fi
            echo "Retry $i: tarball not ready, sleeping 5s..."
            sleep 5
          done
          if [ -z "$SHA" ]; then echo "ERROR: failed to compute tarball sha" >&2; exit 1; fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: ${SHA}"
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: willfell/homebrew-sauce
          token: ${{ secrets.TAP_PR_TOKEN }}
          path: tap
      - name: Patch Formula/sauce.rb
        run: |
          cd tap
          FORMULA="Formula/sauce.rb"
          if [ ! -f "$FORMULA" ]; then echo "ERROR: $FORMULA not found" >&2; exit 1; fi
          awk -v url='${{ steps.sha.outputs.url }}' -v sha='${{ steps.sha.outputs.sha }}' '
            /^  url "/   { print "  url \"" url "\""; next }
            /^  sha256 / { print "  sha256 \"" sha "\""; next }
                         { print }
          ' "$FORMULA" > "${FORMULA}.new"
          mv "${FORMULA}.new" "$FORMULA"
          head -8 "$FORMULA"
      - name: Open tap PR
        id: cpr_tap
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TAP_PR_TOKEN }}
          path: tap
          branch: bump-v${{ steps.tag.outputs.version }}
          delete-branch: true
          commit-message: "feat: sauce v${{ steps.tag.outputs.version }} formula"
          title: "sauce v${{ steps.tag.outputs.version }}"
          body: |
            Auto-generated bump from `willfell/sauce` release of v${{ steps.tag.outputs.version }}.

            - URL: `${{ steps.sha.outputs.url }}`
            - SHA256: `${{ steps.sha.outputs.sha }}`
      - name: Auto-merge the tap PR
        if: ${{ steps.cpr_tap.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN }}
        run: |
          PR="${{ steps.cpr_tap.outputs.pull-request-number }}"
          gh pr merge "$PR" --repo willfell/homebrew-sauce --squash --delete-branch \
            || gh pr merge "$PR" --repo willfell/homebrew-sauce --squash --admin --delete-branch

  # ---- post-merge seed rebaseline (NEVER on-branch — landmine) ----
  rebaseline-seed:
    if: ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --omit=dev
      - name: Rebaseline seed (post-merge only)
        run: |
          npm run seed:prev
          npm run seed:rebaseline
      - name: Commit rebaselined seed
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add platform/test/seed-vault platform/test/seed-vault-prev
          git diff --cached --quiet || git commit -m "chore(seed): rebaseline to v$VERSION"
          git push origin HEAD:main
